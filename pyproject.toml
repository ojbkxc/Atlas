[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-test-platform"
version = "0.1.0"
description = "可携带、知识驱动的 UI/API 测试自动化平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atlas.plugins.demo" = ["knowledge/*.json", "knowledge/contracts/*.json"]

[tool.pytest.ini_options]
addopts = "-p no:playwright -p no:randomly"
testpaths = ["tests"]
