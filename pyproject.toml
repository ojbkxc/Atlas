[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-test-platform"
version = "0.1.0"
description = "可携带、知识驱动的 UI/API 测试自动化平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
# CI 矩阵实测需要补齐的三件（2026-11-24 linux 3.11 Offline gate 翻车清单）：
# ① tzdata：3.11/3.12 的 zoneinfo 没有数据源（Windows 注册表回退所以本地看不见），
#    89 个 ZoneInfo("Europe/*") 用例当场 ZoneInfoNotFoundError；3.13 起 CPython 自带。
# ② allure-pytest：compat 装配探针（test_emit_compat 的 _probe_fast_defaults）经产物
#    fastplugin 包装 allure.attach——环境没有 allure 时装配腿失败，shots_installed 恒 False。
#    本地全局 3.13 恰好装了它所以全绿，CI 才红。
# pytest 8+ 与 cov 原有。
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "allure-pytest>=2.13",
  "tzdata>=2024.1; python_version < '3.13'",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 知识 JSON 是插件资产（契约/坑点/组件/会话默认），不是代码——漏声明则装完 wheel
# `IservicePlugin.contracts()` 抛「契约文件缺失」、DemoRuntime 裸 KeyError: 'ou'。
"atlas.plugins.demo" = ["knowledge/*.json", "knowledge/contracts/*.json"]
"atlas.plugins.iservice" = ["knowledge/*.json", "knowledge/contracts/*.json"]
# 通用知识包（82 条跨平台坑点/组件族/接入清单）：被 plugin_api.common_knowledge_root()
# 指向、两个内置插件经 base_roots 消费；漏打包等于装完即「通用包不可见」。
"atlas.plugins._common" = ["knowledge/*.json"]

[tool.pytest.ini_options]
addopts = "-p no:playwright -p no:randomly"
testpaths = ["tests"]
# 裸 `pytest`（不带 `python -m`）不把 cwd 放进 sys.path，`from scripts.xxx import` 在
# 4 个测试文件收集期 ImportError。显式声明两处根：src（atlas 包，未安装时也能跑）与
# "."（仓库根，scripts/ 顶层模块）。
pythonpath = ["src", "."]
